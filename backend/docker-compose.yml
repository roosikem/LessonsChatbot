services:
  neo4j:
    image: neo4j:5.26-community
    container_name: lessons-neo4j
    ports:
      - "127.0.0.1:7474:7474"   # browser
      - "127.0.0.1:7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j-data:/data

  # Stand-in for a SPARQL knowledge graph during development: a plain SPARQL 1.1 endpoint.
  # Start with: docker compose --env-file .env --profile sparql-sim up -d fuseki
  fuseki:
    image: secoresearch/fuseki@sha256:671f2a2e7f3719fa71443882bedc82e199ac933211aca489f93d3d217f0d7863  # Fuseki 6.2.0, pinned
    platform: linux/amd64
    container_name: lessons-fuseki
    profiles: [sparql-sim]
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?set FUSEKI_ADMIN_PASSWORD in .env}
      ENABLE_DATA_WRITE: "true"
      ENABLE_UPDATE: "true"

  # The app container as it would run on Fargate (STORAGE=s3), against a local S3 stand-in and host
  # Ollama / Bedrock. Start an S3 stand-in on the host first:  pip install "moto[server]" && moto_server -p 9000
  #   docker compose --env-file .env --profile app up -d --build app
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: lessons-chatbot:local
    container_name: lessons-app
    profiles: [app]
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      STORAGE: s3
      S3_BUCKET: lessons
      S3_ENDPOINT_URL: http://host.docker.internal:9000   # host.docker.internal = the host machine (Docker Desktop)
      S3_ACCESS_KEY: local-test
      S3_SECRET_KEY: local-test
      FEEDBACK_STORE: s3
      INDEX_POLL_SECONDS: "5"
      DATASET_CONFIG: /srv/backend/config/dataset.yaml
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_MODEL_ID: bge-m3
      OLLAMA_URL: http://host.docker.internal:11434
      LLM_PROVIDER: ${CONTAINER_LLM_PROVIDER:-bedrock}
      LLM_MODEL_ID: ${CONTAINER_LLM_MODEL_ID:-us.amazon.nova-2-lite-v1:0}
      # Bedrock credentials for a local test come from the shell environment (nothing is mounted);
      # on Fargate the task role is used and these stay empty
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      FEATURE_UPLOAD_UI: "true"
      ADMIN_TOKEN: ${ADMIN_TOKEN}

volumes:
  neo4j-data:
